# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Abinav R
email: abinav.rvkrish@gmail.com
description: > # this means to ignore newlines until "baseurl:"
  Engineering notes on machine learning systems, MLOps,
  inference engineering, computer vision, and production AI.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://abinavravi.github.io" # the base hostname & protocol for your site
author:
  name: Abinav R

collections:
    drafts:
        output: true
        permalink: /:collection/:name/
    notes:
        output: true
        permalink: /:collection/:name/

defaults:
  -
    scope:
      path: ""
      type: drafts
    values:
      layout: draft

permalink: /blogs/:title/

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

twitter_username: AbinavRavi
github_username:  AbinavRavi
linkedin_username: abinavr
# Build settings
markdown: kramdown
